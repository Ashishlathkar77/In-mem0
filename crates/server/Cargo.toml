[package]
name = "inmem-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Thread-per-core RESP server (inmemd) wrapping inmem-core."

[lib]
name = "inmem_server"
path = "src/lib.rs"

[[bin]]
name = "inmemd"
path = "src/main.rs"

[dependencies]
inmem-core.workspace = true
inmem-proto.workspace = true
mimalloc = { version = "0.1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }

[features]
default = []
# Encrypted client connections via rustls. Build/run with: cargo build --features tls
tls = ["dep:rustls", "dep:rustls-pemfile"]
# Linux-only io_uring thread-per-core runtime (glommio). Build on Linux:
#   cargo build --release --features io-uring
io-uring = ["dep:glommio", "dep:futures-lite"]

# io_uring deps are Linux-only; declaring them under a target table keeps macOS/Windows builds
# clean even when the feature is requested elsewhere.
[target.'cfg(target_os = "linux")'.dependencies]
glommio = { version = "0.9", optional = true }
futures-lite = { version = "2", optional = true }
