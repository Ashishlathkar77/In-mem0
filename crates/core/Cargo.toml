[package]
name = "inmem-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Embeddable in-memory cache core: flat hash index + eviction + value store."

[dependencies]
ahash.workspace = true
# Spin-based mutex: in the thread-per-core io_uring runtime a std::Mutex park would stall the
# whole core's event loop on contention; parking_lot spins briefly instead (short critical
# sections), avoiding that stall. Uncontended cost is comparable to std.
parking_lot = "0.12"

[features]
default = []
