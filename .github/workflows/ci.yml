name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test --all
      - name: Release build
        run: cargo build --release

  io-uring-build:
    name: io_uring runtime (linux compile-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install liburing
        run: sudo apt-get update && sudo apt-get install -y liburing-dev
      - name: Build with io_uring feature (glommio)
        run: cargo build --features io-uring
      - name: Clippy io_uring
        run: cargo clippy --features io-uring

  bench-smoke:
    name: benchmark smoke (vs redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install redis tools
        run: sudo apt-get update && sudo apt-get install -y redis-tools redis-server
      - name: Build
        run: cargo build --release
      - name: Short benchmark vs redis
        run: ./scripts/bench.sh 100000 20 || true
