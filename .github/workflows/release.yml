name: Release

# Triggered by pushing a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release + upload assets
  packages: write   # push the Docker image to GHCR

jobs:
  binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux-x86_64,  rust: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: linux-aarch64, rust: aarch64-unknown-linux-gnu }
          - { os: macos-13,         target: macos-x86_64,  rust: x86_64-apple-darwin }
          - { os: macos-latest,     target: macos-aarch64, rust: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --bin inmemd
      - name: Stage asset
        shell: bash
        run: cp target/release/inmemd "inmemd-${{ matrix.target }}"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: inmemd-${{ matrix.target }}
          generate_release_notes: true

  docker:
    name: docker → ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner
        id: o
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.o.outputs.owner }}/inmem:latest
            ghcr.io/${{ steps.o.outputs.owner }}/inmem:${{ github.ref_name }}
